plugins { id 'com.android.application' version '9.4.0' }
def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) localConfigFile.withInputStream { localConfig.load(it) }
def booksApiKey = providers.environmentVariable('GOOGLE_BOOKS_API_KEY').getOrElse(localConfig.getProperty('googleBooksApiKey', '')).trim()

android {
    namespace 'ru.homebooks.library'
    buildFeatures { buildConfig = true }
    compileSdk 37
    defaultConfig {
        applicationId 'ru.homebooks.library'
        minSdk 23
        targetSdk 35
        buildConfigField 'String', 'GOOGLE_BOOKS_API_KEY', groovy.json.JsonOutput.toJson(booksApiKey)
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Device tests must never install/uninstall the user's real library.
    testBuildType 'qa'
    buildTypes {
        qa {
            initWith debug
            applicationIdSuffix '.testbed'
            matchingFallbacks = ['debug']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
